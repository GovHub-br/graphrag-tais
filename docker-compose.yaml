services:

  qdrant:
    image: qdrant/qdrant:v1.15.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    networks:
      - default

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default

  # `pgsty/minio` é um fork comunitário do MinIO (mesmo binário, mesmas envs e
  # mesmo formato em disco). A MinIO arquivou a edição comunitária e tirou
  # `minio/minio` do Docker Hub e do quay.io — o pull passou a dar 401/"access
  # denied". Tag fixa: o fork publica `RELEASE.*` como o upstream fazia.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: minio
    ports:
      - "9000:9000"   # API S3 (upload + download assinado)
      - "9001:9001"   # console web
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - default

  hayhooks:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphrag-tais/hayhooks:latest
    container_name: hayhooks
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:rw
      # Catálogo de colunas sensíveis (ADR-0018). Read-only e FORA da imagem:
      # o mapeamento é revisado por gente de domínio e muda sem deploy de
      # código — mas entra por PR, como o resto do repositório.
      - ./config:/app/config:ro
    # Sobe o app do PROJETO (`rag.server.app`), que é o app do Hayhooks + as
    # rotas próprias (hoje: /files, o download do relatório e da amostra). O
    # `hayhooks run` não tem gancho para rota custom; com --reload ele mesmo
    # chama `uvicorn hayhooks.server.app:create_app --factory`, então isto é a
    # MESMA execução, só que apontando para o nosso factory. A config do
    # Hayhooks (pipelines-dir / additional-python-path) vira env, que é como o
    # CLI a propaga.
    command: [
      "uvicorn", "rag.server.app:create_app",
      "--factory",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--reload",
      "--reload-dir", "/app/src"
    ]
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
      - HAYHOOKS_PIPELINES_DIR=/app/src/rag/pipelines
      - HAYHOOKS_ADDITIONAL_PYTHON_PATH=/app/src
    depends_on:
      - qdrant
      - neo4j
      - redis
      - minio
      # Ordem de subida, não requisito: o McpSqlExecutor conecta preguiçosamente
      # e a resposta degrada para só-texto se o executor estiver fora.
      - trino-mcp
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  # Executor do SQL (ADR-0017). É ELE que segura a credencial do banco — o RAG
  # não conhece senha de banco nenhum, só fala MCP (ADR-0004).
  #
  # Read-only: `TRINO_ALLOW_WRITE_QUERIES=false` faz o servidor aceitar apenas
  # SELECT/SHOW/DESCRIBE/EXPLAIN e recusar qualquer DML/DDL. **Não ligue** isso
  # — é o guardrail que substitui o modo RESTRICTED do postgres-mcp.
  #
  # ⚠️ Transporte: `MCP_TRANSPORT=http` publica DOIS caminhos, `/mcp` e `/sse`,
  # e os dois falam **Streamable HTTP** (o `/sse` é só compatibilidade de rota,
  # não é o SSE clássico). Use `/mcp` em `SQL_MCP_URL` e
  # `SQL_MCP_TRANSPORT=streamable_http`.
  trino-mcp:
    image: ghcr.io/tuannvm/mcp-trino:${TRINO_MCP_TAG:-latest}
    container_name: trino-mcp
    environment:
      TRINO_HOST: ${TRINO_HOST}
      TRINO_PORT: ${TRINO_PORT:-443}
      TRINO_USER: ${TRINO_USER}
      TRINO_PASSWORD: ${TRINO_PASSWORD}
      TRINO_CATALOG: ${TRINO_CATALOG}
      TRINO_SCHEMA: ${TRINO_SCHEMA:-default}
      # O servidor chama de SCHEME o que a infra do GovHub chama de PROTOCOL.
      TRINO_SCHEME: ${TRINO_PROTOCOL:-https}
      # ⚠️ NÃO FUNCIONA nesta imagem — mantido só para não parecer esquecido.
      # O mcp-trino registra um `custom_client` no driver Go, e no
      # trino-go-client o ramo do `custom_client` é um `else if` contra o ramo
      # de TLS: com ele setado o driver NUNCA lê SSLInsecure/SSLCert. O cliente
      # registrado usa `http.DefaultTransport`, que SEMPRE valida certificado.
      # Quem resolve de verdade é o par SSL_CERT_FILE + extra_hosts abaixo.
      TRINO_SSL_INSECURE: ${TRINO_SSL_INSECURE:-true}
      # Confiança no certificado do Trino. O runtime Go respeita SSL_CERT_FILE
      # (crypto/x509: se setado, SUBSTITUI o bundle do sistema). Vazio = usa as
      # CAs públicas da imagem, que é o certo em produção com CA de verdade.
      SSL_CERT_FILE: ${TRINO_CA_FILE:-}
      # Guardrail read-only. Não mude.
      TRINO_ALLOW_WRITE_QUERIES: "false"
      TRINO_QUERY_TIMEOUT: ${TRINO_QUERY_TIMEOUT:-120}
      # Teto do SERVIDOR (o do RAG é MAX_EXEC_ROWS): corta o streaming antes de
      # a resposta virar memória. Deixe acima do teto da aplicação.
      TRINO_MAX_ROWS: ${TRINO_MAX_ROWS:-5000}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8080"
    ports:
      - "127.0.0.1:${TRINO_MCP_PORT:-8002}:8080"
    restart: unless-stopped
    volumes:
      # PEM do Trino (gitignored — é material do ambiente, e rotaciona).
      # Como buscar: ver o README de `certs/`.
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/status"]
      interval: 15s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # ⚠️ O certificado da homologação é emitido para o nome do serviço no
      # cluster (`CN=trino.trino.svc.cluster.local`) e **não tem IP SAN** — por
      # IP a validação falha SEMPRE, com qualquer CA confiável. Então
      # `TRINO_HOST` precisa ser o NOME do certificado, e é este mapeamento que
      # faz esse nome resolver no IP real. Com certificado que cubra o IP (ou
      # com DNS de verdade), deixe `TRINO_ADDR` vazio e isto vira inofensivo.
      - "${TRINO_TLS_HOSTNAME:-trino.invalid}:${TRINO_ADDR:-127.0.0.1}"
    networks:
      - default

  # LEGADO (ADR-0013), mantido para quem quiser voltar ao Postgres direto.
  # Fica atrás do profile `postgres` para NÃO subir por engano: sem as
  # `ANALYTICS_DB_*` preenchidas ele entra em loop de restart.
  #   docker compose --profile postgres up -d postgres-mcp
  # e aponte `SQL_MCP_URL=http://postgres-mcp:8000/sse`,
  # `SQL_MCP_TRANSPORT=sse`, `SQL_MCP_TOOL=execute_sql`, `SQL_MCP_TOOL_ARG=sql`,
  # `SQL_DIALECT=postgres` (+ reverter o dialeto escrito em `query_system.md`).
  postgres-mcp:
    image: crystaldba/postgres-mcp
    container_name: postgres-mcp
    profiles: ["postgres"]
    environment:
      DATABASE_URI: "postgresql://${ANALYTICS_DB_USER}:${ANALYTICS_DB_PASSWORD}@${ANALYTICS_DB_HOST}:${ANALYTICS_DB_PORT:-5432}/${ANALYTICS_DB_NAME}"
    command:
      - "--access-mode=restricted"
      - "--transport=sse"
    ports:
      - "127.0.0.1:${POSTGRES_MCP_PORT:-8001}:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  webui:
    # Imagem propria: Open WebUI oficial + identidade visual GovHub assada
    # dentro (webui/Dockerfile). Antes o tema entrava por bind mounts de
    # ./webui, que so funcionam com o repositorio clonado ao lado do container:
    # num deploy sem o repo o tema sumia.
    #
    # Para editar CSS/JS sem rebuildar, os mounts continuam disponiveis em
    # docker-compose.dev.yaml (uso documentado em webui/README.md).
    #
    # A tag base do Open WebUI e o build arg OPEN_WEBUI_TAG, pinado de
    # proposito: o tema (webui/custom.css) depende dos design tokens desta
    # build, e em ':main' um pull silencioso poderia trocar o CSS por baixo.
    #
    # v0.11.0, nao v0.10.2: a migration `f0bd01a18a3d` entrou na 0.11.0, e o
    # Alembic nao sabe DESCER de revisao. Um banco que ja rodou 0.11.0+ (era o
    # caso em prod, que vinha de ':main') faz a 0.10.2 abortar o boot com
    # `Can't locate revision identified by 'f0bd01a18a3d'`. Ao mudar este pin,
    # so suba de versao; para descer, o volume `open-webui` tem de ser recriado.
    image: ghcr.io/govhub-br/tais-webui:${TAIS_WEBUI_TAG:-v0.11.0-govhub.1}
    build:
      context: ./webui
      args:
        OPEN_WEBUI_TAG: ${WEBUI_DOCKER_TAG:-v0.11.0}
    container_name: open-webui
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - WEBUI_AUTH=false
      - OPENAI_API_BASE_URL=http://hayhooks:8000
      - OPENAI_API_KEY=dummy
      - ENABLE_TAGS_GENERATION=true
      # Nome do produto: barra lateral, titulo da aba, telas de sistema.
      # ⚠️ O backend anexa " (Open WebUI)" a QUALQUER nome custom
      # (`env.py`: `if WEBUI_NAME != 'Open WebUI': WEBUI_NAME += ' (Open WebUI)'`).
      # Nao ha env que desligue isso, e o sufixo e mantido de proposito: e o
      # co-branding que a licenca pede. Nome limpo exige LICENSE_KEY enterprise.
      - WEBUI_NAME=TAIS GovHub
      - DEFAULT_LOCALE=pt-BR
      - ENABLE_VERSION_UPDATE_CHECK=false
      # Tira o "Arena Model" do dropdown: so as personas do GovHub aparecem.
      # Vale para instalacao NOVA; em banco existente o valor salvo vence o env
      # (mesma pegadinha do DEFAULT_PROMPT_SUGGESTIONS abaixo), e quem aplica e
      # o scripts/setup_webui_models.sh.
      - ENABLE_EVALUATION_ARENA_MODELS=false
      - 'DEFAULT_PROMPT_SUGGESTIONS=[{"title": ["Explorar o catálogo", "o que existe sobre habitação?"], "content": "O que vocês têm sobre financiamento habitacional?"}, {"title": ["Ver as bases disponíveis", "panorama por domínio"], "content": "Quais bases de dados vocês têm?"}, {"title": ["Medir um indicador", "contratado x desembolsado"], "content": "Qual o total contratado por unidade da federação?"}, {"title": ["Acompanhar no tempo", "série mensal"], "content": "Como evoluiu o número de empreendimentos por mês no último ano?"}]'
    depends_on:
      - hayhooks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

volumes:
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  open-webui:
    driver: local

networks:
  default:
    driver: bridge
