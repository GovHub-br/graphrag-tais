services:

  qdrant:
    image: qdrant/qdrant:v1.15.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    networks:
      - default

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - default

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API S3 (upload + download assinado)
      - "9001:9001"   # console web
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - default

  hayhooks:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphrag-tais/hayhooks:latest
    container_name: hayhooks
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:rw
    command: [
      "hayhooks",
      "run",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--pipelines-dir", "/app/src/rag/pipelines",
      "--additional-python-path", "/app/src/",
      "--reload"
    ]
    env_file:
      - .env
    depends_on:
      - qdrant
      - neo4j
      - redis
      - minio
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  postgres-mcp:
    image: crystaldba/postgres-mcp
    container_name: postgres-mcp
    environment:
      DATABASE_URI: "postgresql://${ANALYTICS_DB_USER}:${ANALYTICS_DB_PASSWORD}@${ANALYTICS_DB_HOST}:${ANALYTICS_DB_PORT:-5432}/${ANALYTICS_DB_NAME}"
    command:
      - "--access-mode=restricted"
      - "--transport=sse"
    ports:
      - "127.0.0.1:${POSTGRES_MCP_PORT:-8001}:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  webui:
    # Pinado: o tema GovHub (webui/custom.css) depende dos design tokens desta
    # build. Em ':main' um pull silencioso poderia trocar o CSS por baixo.
    #
    # v0.11.0, nao v0.10.2: a migration `f0bd01a18a3d` entrou na 0.11.0, e o
    # Alembic nao sabe DESCER de revisao. Um banco que ja rodou 0.11.0+ (era o
    # caso em prod, que vinha de ':main') faz a 0.10.2 abortar o boot com
    # `Can't locate revision identified by 'f0bd01a18a3d'`. Ao mudar este pin,
    # so suba de versao; para descer, o volume `open-webui` tem de ser recriado.
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG:-v0.11.0}
    container_name: open-webui
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data
      # --- identidade visual GovHub (ganchos oficiais do Open WebUI) ---------
      # Montado em /app/build/static (a FONTE), nao em backend/open_webui/static:
      # o config.py limpa o segundo e o recopia do primeiro a cada boot.
      - ./webui/custom.css:/app/build/static/custom.css:ro
      - ./webui/loader.js:/app/build/static/loader.js:ro
      - ./webui/assets/govhub-mark-light.svg:/app/build/static/govhub-mark-light.svg:ro
      - ./webui/assets/govhub-horizontal.svg:/app/build/static/govhub-horizontal.svg:ro
      - ./webui/assets/govhub-horizontal-light.svg:/app/build/static/govhub-horizontal-light.svg:ro
      - ./webui/assets/favicon.png:/app/build/static/favicon.png:ro
      - ./webui/assets/favicon.svg:/app/build/static/favicon.svg:ro
      - ./webui/assets/favicon.ico:/app/build/static/favicon.ico:ro
      - ./webui/assets/favicon-96x96.png:/app/build/static/favicon-96x96.png:ro
      - ./webui/assets/apple-touch-icon.png:/app/build/static/apple-touch-icon.png:ro
      - ./webui/assets/logo.png:/app/build/static/logo.png:ro
      - ./webui/assets/splash.png:/app/build/static/splash.png:ro
      - ./webui/assets/splash-dark.png:/app/build/static/splash-dark.png:ro
      - ./webui/assets/web-app-manifest-192x192.png:/app/build/static/web-app-manifest-192x192.png:ro
      - ./webui/assets/web-app-manifest-512x512.png:/app/build/static/web-app-manifest-512x512.png:ro
    environment:
      - WEBUI_AUTH=false
      - OPENAI_API_BASE_URL=http://hayhooks:8000
      - OPENAI_API_KEY=dummy
      - ENABLE_TAGS_GENERATION=true
      # O backend anexa " (Open WebUI)" a qualquer nome custom (env.py:842-844).
      # Mantido de proposito: e o co-branding que a licenca pede.
      - WEBUI_NAME=Assistente de Dados GovHub
      - DEFAULT_LOCALE=pt-BR
      - ENABLE_VERSION_UPDATE_CHECK=false
      # Tira o "Arena Model" do dropdown: so as personas do GovHub aparecem.
      # Vale para instalacao NOVA; em banco existente o valor salvo vence o env
      # (mesma pegadinha do DEFAULT_PROMPT_SUGGESTIONS abaixo), e quem aplica e
      # o scripts/setup_webui_models.sh.
      - ENABLE_EVALUATION_ARENA_MODELS=false
      - 'DEFAULT_PROMPT_SUGGESTIONS=[{"title": ["Explorar o catálogo", "o que existe sobre habitação?"], "content": "O que vocês têm sobre financiamento habitacional?"}, {"title": ["Ver as bases disponíveis", "panorama por domínio"], "content": "Quais bases de dados vocês têm?"}, {"title": ["Medir um indicador", "contratado x desembolsado"], "content": "Qual o total contratado por unidade da federação?"}, {"title": ["Acompanhar no tempo", "série mensal"], "content": "Como evoluiu o número de empreendimentos por mês no último ano?"}]'
    depends_on:
      - hayhooks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

volumes:
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  open-webui:
    driver: local

networks:
  default:
    driver: bridge
